<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Openers Setup</title>
<meta name="description" content="The setup for the free keyword-openers skill now lives on the main page.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://jaygptpro.com/keyword-openers/#setup">
<script>
// The setup guide moved into the main page. Old links like guide/#step3 land on the same step there.
(function () {
  var MAP = { get: 'setup', need: 'need', step1: 'claude', step2: 'tools', step3: 'genrupt', step4: 'skill', step5: 'run', step6: 'amazon', tips: 'fixes' };
  var h = (location.hash || '').slice(1);
  var target = '#' + (MAP[h] || 'setup');
  var base = location.protocol === 'file:' ? '../index.html' : '../';
  location.replace(base + target);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=../#setup"></noscript>
<style>
  :root { --bg:#FAF7F1; --ink:#22201C; --mute:#6B645A; --link:#A9531F; color-scheme:light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14120F; --ink:#F1ECE3; --mute:#A79F92; --link:#EE9A5E; color-scheme:dark; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:26px; line-height:1.2; margin:0 0 10px; }
  p { color:var(--mute); margin:0 0 14px; }
  a { color:var(--link); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>The setup guide moved</h1>
  <p>Every setup step is now on one page, next to the demo.</p>
  <p><a href="../#setup" id="go">Open the setup</a></p>
</main>
<script>
if (location.protocol === 'file:') { var a = document.getElementById('go'); if (a) a.href = '../index.html#setup'; }
</script>
</body>
</html>
