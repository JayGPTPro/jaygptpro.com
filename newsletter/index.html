<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay’s Master Key Newsletter</title>
  <meta name="description" content="Every Tuesday at 9:00 am EST. Practical AI for eCommerce. Tools, tactics, and signals you can use." />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #006b78;
      color: #0f172a;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgb(0 0 0 / .25);
      text-align: center;
    }
    .card img { display: block; width: 100%; height: auto; }
    .body { padding: 24px 24px 28px; }
    h1 { font-size: 28px; margin: 0 0 8px; color: #1e3a3a; }
    .lede { font-size: 16px; line-height: 1.5; color: #3c4858; margin: 0 0 18px; }
    .note { font-size: 13px; color: #8390a4; margin-top: 10px; }
    /* the EmailOctopus form, made to fit the card */
    #eo-form form { margin: 0 !important; }
    #eo-form [data-form] { max-width: 100% !important; }
    #eo-form input[type="email"] { border-radius: 8px !important; font-size: 16px !important; }
    #eo-form button[type="submit"], #eo-form input[type="submit"] { background: #006b78 !important; border-color: #006b78 !important; color: #fff !important; border-radius: 8px !important; font-weight: 700 !important; }
  </style>
<!-- Google Analytics -->

</script>

<body>
  <div class="wrap">
    <div class="card">
      <img src="banner.jpg" width="1080" height="458" alt="Jay's Master Key, the AI newsletter for eCommerce sellers">
      <div class="body">
        <h1>Jay's Master Key Newsletter</h1>
        <p class="lede">Every Tuesday at 9:00 am EST. Practical AI for eCommerce. Tools, tactics, and signals you can use.</p>
        <!-- EmailOctopus form on the Audience list (Jay moved off Brevo) -->
        <div id="eo-form"><script async src="https://eocampaign1.com/form/8ba0699a-d949-11f1-b5eb-f91f1d6cc6e0.js" data-form="8ba0699a-d949-11f1-b5eb-f91f1d6cc6e0"></script></div>
        <div class="note">No spam. Unsubscribe anytime.</div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById("eo-form").addEventListener("submit", function () {
      try { gtag("event", "newsletter_signup", { where: "newsletter-page" }); } catch (e) {}
      try { fbq("track", "Lead", { where: "newsletter-page" }); } catch (e) {}
    }, true);
  </script>
</body>
</html>
