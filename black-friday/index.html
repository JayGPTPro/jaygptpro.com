<style>
:root{
  --bg:#000;--s1:#0e0e10;--s2:#151517;--s3:#1c1c1f;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --txt:#f5f5f7;--mute:#a1a1a6;--soft:#6e6e73;--lime:#d4ff00;--ink:#0b0d00;
  --f:"Geist",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:70px}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:10px}
.wrap{width:min(1280px,100% - 40px);margin-inline:auto}

/* top */
.top{position:sticky;top:0;z-index:60;background:rgba(0,0,0,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top .wrap{height:56px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--mute);font-weight:600}
.draft{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--soft);border:1px dashed var(--line2);border-radius:6px;padding:3px 7px}
.ends{margin-left:auto;font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.ends b{color:var(--txt)}

/* layout: the station stays on screen, the products scroll next to it */
.layout{display:grid;grid-template-columns:440px minmax(0,1fr);gap:48px;align-items:start;padding-top:32px}
.left{position:sticky;top:72px}
.eb{font-size:14px;font-weight:700;color:var(--lime)}
h1{margin-top:6px;font-weight:800;font-size:clamp(44px,4.6vw,64px);line-height:.98;letter-spacing:-.045em}
h1 em{font-style:normal;color:var(--lime)}
.sub{margin-top:12px;font-size:17px;color:var(--mute);line-height:1.4;max-width:36ch}
.sub b{color:var(--txt);font-weight:700}
.clock{margin-top:14px;display:inline-flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 14px;border:1px solid var(--line2);border-radius:999px}
.cl-l{font-size:13px;font-weight:700;color:var(--mute)}
.cl-d{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cl-d i{font-style:normal;color:var(--soft);font-weight:600;font-size:13px;margin:0 7px 0 1px}
.clock[hidden]{display:none}

/* ===== the pair station ===== */
.station{margin-top:20px;background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:16px 18px 18px;position:relative}
.station::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;background:radial-gradient(70% 50% at 50% 0%,rgba(212,255,0,.08),transparent 70%)}
.st-hd{display:flex;align-items:center;gap:10px;min-height:28px}
.st-hd .t{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dots{display:flex;gap:6px}
.dots button{height:24px;min-width:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;color:var(--mute);border:1px solid var(--line2)}
.dots button[aria-pressed=true]{background:var(--txt);color:#000;border-color:var(--txt)}
.st-hd .clr{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--mute)}
.st-hd .clr:hover{color:var(--txt)}
.slots{margin-top:10px;display:grid;grid-template-columns:1fr 34px 1fr;align-items:center}
.slot{position:relative}
.slot .lab{display:block;margin-bottom:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:center}
.slot.f .lab{color:var(--lime)}
.op{text-align:center;font-size:26px;font-weight:800;color:var(--soft);padding-top:22px}
.ghost{aspect-ratio:3/4;border-radius:20px;border:1.5px dashed var(--line2);display:grid;place-items:center;text-align:center;padding:12px;color:var(--soft)}
.ghost b{display:block;font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1;color:#3a3a3e}
.ghost small{display:block;margin-top:8px;font-size:13px;font-weight:600;line-height:1.3}
.slot.f .ghost{border-color:rgba(212,255,0,.45)}
.slot.f .ghost b{color:rgba(212,255,0,.35)}
.slot.f .ghost small{color:var(--lime)}
.sc{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--s2);border:1px solid var(--line2);display:flex;flex-direction:column}
.sc img{width:100%;flex:1;min-height:0;object-fit:cover}
.sc .nm{padding:9px 11px 10px;background:var(--s2)}
.sc .nm b{display:block;font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .nm span{display:block;margin-top:2px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.sc .nm s{font-size:12px;font-weight:500;color:var(--soft);margin-right:5px}
.sc .x{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;font-size:15px;line-height:26px;text-align:center;z-index:3}
.slot.f .sc{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 18px 40px rgba(212,255,0,.08)}
.slot.f .sc .nm span{color:var(--soft);text-decoration:line-through}
.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg);z-index:2;background:var(--lime);color:var(--ink);font-size:26px;font-weight:900;letter-spacing:.02em;padding:8px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.st-sum{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.st-sum .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.st-sum .big{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.st-sum .was{font-size:13px;color:var(--soft);margin-top:4px}
.save{display:inline-block;background:var(--lime);color:var(--ink);font-size:14px;font-weight:900;padding:7px 11px;border-radius:10px;white-space:nowrap}
.brk{margin-top:10px;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.brk div{display:flex;justify-content:space-between;padding:1px 0}
.brk b{color:var(--txt);font-weight:600}
.co{margin-top:14px;width:100%;height:52px;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:800;font-size:16px;transition:transform .12s,opacity .2s}
.co:hover{opacity:.92}.co:active{transform:scale(.98)}
.co:disabled{background:var(--s3);color:var(--soft);cursor:default}
.after{margin-top:10px;font-size:13px;color:var(--mute);text-align:center;line-height:1.4}
.rule{margin-top:10px;font-size:12.5px;color:var(--soft);text-align:center;line-height:1.4}
.st-close{display:none}

/* ===== the products ===== */
.right{padding-bottom:80px}
.best{display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--s1);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.best .duo{display:grid;grid-template-columns:1fr 1fr}
.best .duo img{width:100%;height:100%;object-fit:cover}
.best .bd{padding:22px 24px}
.kick{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.best h2{margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.best p{margin-top:6px;color:var(--mute);font-size:15px}
.best .eq{margin-top:12px;font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums}
.best .eq b{color:var(--txt)}
.best .eq i{font-style:normal;background:var(--lime);color:var(--ink);font-weight:800;padding:1px 6px;border-radius:5px}
.pill{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border-radius:999px;font-weight:800;font-size:14px;background:var(--txt);color:#000;white-space:nowrap;transition:background .2s}
.pill:hover{background:var(--lime)}
.pill.on{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.best .pill{margin-top:14px}
.grp{margin-top:44px}
.grp-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.grp-h h2{font-size:26px;font-weight:800;letter-spacing:-.03em}
.grp-h p{color:var(--mute);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-3px);border-color:var(--line2)}
.card .im{aspect-ratio:4/3;overflow:hidden;background:var(--s2)}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .im img{transform:scale(1.04)}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.cc{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:11px;font-weight:700;border:1px solid rgba(217,119,87,.5);background:rgba(217,119,87,.1);border-radius:999px;padding:2px 8px 2px 5px;margin-bottom:7px}
.cc img{width:12px;height:12px}
.card h3{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.card p{margin-top:5px;font-size:14px;color:var(--mute);line-height:1.42}
.card .ft{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pr{line-height:1.1;font-variant-numeric:tabular-nums}
.pr s{display:block;font-size:12.5px;color:var(--soft)}
.pr b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.card .add{height:36px;padding:0 15px;border-radius:999px;background:var(--txt);color:#000;font-size:13.5px;font-weight:800;white-space:nowrap}
.card:hover .add{background:var(--lime)}
.card .det{margin-top:9px;font-size:13px;font-weight:700;color:var(--mute);align-self:flex-start}
.card .det:hover{color:var(--txt)}
.card .st{position:absolute;top:10px;right:10px;z-index:2;font-size:11.5px;font-weight:900;letter-spacing:.04em;padding:5px 9px;border-radius:999px;visibility:hidden}
.card.pay{border-color:var(--txt)}
.card.pay .st{visibility:visible;background:var(--txt);color:#000}
.card.free{border-color:var(--lime)}
.card.free .st{visibility:visible;background:var(--lime);color:var(--ink)}
.card.free .pr b{text-decoration:line-through;color:var(--soft)}
.card.in .add{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.card .bs{position:absolute;top:10px;left:10px;z-index:2;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);color:#fff}
.card.can{border-color:rgba(212,255,0,.5);border-style:dashed}
.card.in .bs{display:none}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--soft);font-size:12px}
footer a{color:var(--mute)}
.toast{position:fixed;left:50%;top:68px;transform:translate(-50%,-140px);z-index:220;background:var(--txt);color:#000;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;transition:transform .4s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
.veil{display:none}

/* ===== small screens: the station docks at the bottom and opens up ===== */
@media (max-width:980px){
  .layout{grid-template-columns:1fr;gap:0;padding-top:24px}
  .left{position:static}
  .intro{text-align:center}
  .sub{margin-inline:auto}
  .right{padding-top:24px;padding-bottom:150px}
  .station{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:120;margin:0;padding:10px 12px;border-radius:22px;background:rgba(22,22,24,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:88vh;overflow:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;cursor:pointer}
  .station::before{display:none}
  .station .st-hd,.station .brk,.station .rule,.station .after,.station .slot .lab,.station .was,.station .sc .nm,.station .sc .x,.station .ghost small{display:none}
  .station .slots{margin:0;grid-template-columns:52px 18px 52px}
  .station .op{padding:0;font-size:16px}
  .station .ghost,.station .sc{border-radius:12px;aspect-ratio:1/1;padding:0}
  .station .ghost b{font-size:20px}
  .station .stamp{font-size:10px;padding:3px 5px;border-radius:5px;top:auto;bottom:4px;transform:translateX(-50%) rotate(-6deg)}
  .station .st-sum{margin:0;padding:0;border:0;display:block}
  .station .st-sum .lbl{font-size:10.5px}
  .station .st-sum .big{font-size:26px}
  .station .save{display:none}
  .station .co{margin:0;width:auto;height:44px;padding:0 18px;font-size:14px}
  .station.open{display:block;padding:14px 16px 18px;left:0;right:0;bottom:0;border-radius:26px 26px 0 0;cursor:default}
  .station.open .st-hd{display:flex}
  .station.open .brk,.station.open .rule,.station.open .after,.station.open .was,.station.open .ghost small{display:block}
  .station.open .slot .lab{display:block}
  .station.open .sc .nm{display:block}
  .station.open .sc .x{display:block}
  .station.open .slots{margin-top:10px;grid-template-columns:1fr 30px 1fr}
  .station.open .ghost,.station.open .sc{aspect-ratio:3/4;border-radius:18px}
  .station.open .ghost{padding:12px}
  .station.open .ghost b{font-size:52px}
  .station.open .stamp{font-size:20px;padding:6px 12px;top:40%;bottom:auto;transform:translate(-50%,-50%) rotate(-12deg)}
  .station.open .st-sum{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex}
  .station.open .st-sum .big{font-size:40px}
  .station.open .save{display:inline-block}
  .station.open .co{margin-top:14px;width:100%;height:50px}
  .station.open .st-close{display:block;margin:0 auto 8px;width:44px;height:5px;border-radius:3px;background:#444}
  .veil{display:block;position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
  .veil.on{opacity:1;pointer-events:auto}
  .best{grid-template-columns:1fr}
  .best .duo{height:220px}
}
@media (max-width:560px){
  .wrap{width:calc(100% - 24px)}
  h1{font-size:44px}
  .sub{font-size:16px}
  .draft{display:none}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .card .bd{padding:11px 12px 13px}
  .card h3{font-size:15px}
  .card p{display:none}
  .pr b{font-size:18px}
  .card .ft{flex-direction:column;align-items:stretch;gap:8px}
  .card .add{width:100%}
  .best .bd{padding:18px}
  .best h2{font-size:26px}
  .grp{margin-top:34px}
  .grp-h h2{font-size:22px}
  .ends{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
  function track(n, p){ try { gtag("event", n, p || {}); } catch(e){} }
  function toast(t){ var e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove("on"); }, 2200); }
  var CC = '<span class="cc"><img src="img/claude.svg" alt="">Claude Code</span>';
  function docked(){ return matchMedia("(max-width:980px)").matches; }

  /* the 1+1 rule: priciest first, pair neighbours, the second of each pair is free */
  function calc(ids){
    var items = ids.map(function(id){ return byId[id]; }).filter(Boolean).sort(function(a,b){ return b.price - a.price || a.ord - b.ord; });
    var pairs = [], free = {}, pairOf = {}, full = 0, off = 0;
    for (var i = 0; i < items.length; i += 2){
      var a = items[i], b = items[i+1] || null; pairs.push([a,b]); full += a.price; pairOf[a.id] = pairs.length - 1;
      if (b){ full += b.price; off += b.price; free[b.id] = 1; pairOf[b.id] = pairs.length - 1; }
    }
    var reg = items.reduce(function(t,p){ return t + (p.was || p.price); }, 0);
    return { items:items, pairs:pairs, free:free, pairOf:pairOf, full:full, off:off, pay:full-off, reg:reg };
  }

  var NOW_OFF = (function(){ var m = location.search.match(/[?&]now=([^&]+)/), t = m && Date.parse(decodeURIComponent(m[1])); return t ? t - Date.now() : 0; })();
  var phase = "";
  function tick(){
    var now = Date.now() + NOW_OFF, ph = now < BF_END ? "bf" : now < CM_END ? "cm" : "over";
    var name = ph === "bf" ? "Black Friday" : "Cyber Monday", end = ph === "bf" ? BF_END : CM_END;
    if (ph !== phase){
      phase = ph;
      $("ev").textContent = "· " + name;
      $("eb").textContent = ph === "bf" ? "Black Friday 2026 · Everything in the store" : ph === "cm" ? "Cyber Monday 2026 · Same deal, until Monday night" : "The 1+1 has ended";
      $("cl-l").textContent = name + " ends in";
      $("clock").hidden = ph === "over";
      document.title = name + " 1+1 · Buy one, get one free · Jay GPT Pro";
    }
    var s = Math.max(0, Math.floor((end - now)/1000)), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sc = s%60;
    function two(n){ return String(n).padStart(2,"0"); }
    $("cl-d").innerHTML = (d ? d + '<i>d</i>' : '') + two(h) + '<i>h</i>' + two(m) + '<i>m</i>' + two(sc) + '<i>s</i>';
    $("ends").innerHTML = ph === "over" ? "The 1+1 has ended" : name + ' ends in <b>' + (d ? d + 'd ' : '') + h + 'h ' + m + 'm</b>';
  }

  /* ---------- products ---------- */
  function build(){
    var bc = calc(BEST), d = byId.donna, w = byId.wonka;
    $("best").innerHTML = '<div class="duo"><img src="'+d.img+'" alt="Donna"><img src="'+w.img+'" alt="Wonka"></div>' +
      '<div class="bd"><span class="kick">★ Most popular pair</span><h2>Donna + Wonka</h2>' +
      '<p>Your AI chief of staff and your AI creative director. Both built in Claude Code.</p>' +
      '<p class="eq">Wonka <b>'+money(w.price)+'</b> + Donna <i>FREE</i> = <b>'+money(bc.pay)+'</b> · regular <s>'+money(bc.reg)+'</s></p>' +
      '<button class="pill" id="best-btn" data-bundle="donna,wonka">Put this pair in</button></div>';
    $("groups").innerHTML = GROUPS.map(function(g){
      return '<section class="grp"><div class="grp-h"><h2>'+esc(g.name)+'</h2><p>'+esc(g.line)+'</p></div><div class="cards">' +
        P.filter(function(p){ return p.g === g.id; }).map(function(p){
          return '<article class="card" id="c-'+p.id+'" data-t="'+p.id+'"><div class="im"><img src="'+p.img+'" alt="'+esc(p.name)+'" loading="lazy"></div>' +
            (BEST.indexOf(p.id) >= 0 ? '<span class="bs">★ Best seller</span>' : '') + '<span class="st"></span>' +
            '<div class="bd">'+(p.cc ? CC : '')+'<h3>'+esc(p.name)+'</h3><p>'+esc(p.line)+'</p>' +
            '<div class="ft"><div class="pr">'+(p.was ? '<s>'+money(p.was)+'</s>' : '')+'<b>'+money(p.price)+'</b></div><button class="add">Add</button></div>' +
            '<a class="det" href="'+p.url+'" target="_blank" rel="noopener" data-more="'+p.id+'">Details ↗</a></div></article>';
        }).join("") + '</div></section>';
    }).join("");
  }

  /* ---------- the station ---------- */
  function cardHtml(p, isFree){
    return '<div class="sc" data-sc="'+p.id+'"><img src="'+p.img+'" alt=""><div class="nm"><b>'+esc(p.name)+'</b><span>'+(p.was && !isFree ? '<s>'+money(p.was)+'</s>' : '')+money(p.price)+'</span></div>' +
      (isFree ? '<span class="stamp">FREE</span>' : '') + '<button class="x" data-rm="'+p.id+'" aria-label="Remove '+esc(p.name)+'">×</button></div>';
  }
  function stationHtml(c){
    var n = c.items.length, pr = n ? c.pairs[view] : null;
    var hd = '<span class="st-close" aria-hidden="true"></span><div class="st-hd"><span class="t">'+(c.pairs.length > 1 ? 'Your pairs' : 'Your pair')+'</span>' +
      (c.pairs.length > 1 ? '<span class="dots">'+c.pairs.map(function(_, i){ return '<button data-view="'+i+'" aria-pressed="'+(i===view)+'">'+(i+1)+'</button>'; }).join("")+'</span>' : '') +
      (n ? '<button class="clr" data-clear>Clear</button>' : '') + '</div>';
    var paid = pr ? cardHtml(pr[0], false) : '<div class="ghost"><div><b>1</b><small>Pick anything</small></div></div>';
    var cand = pr && P.some(function(q){ return cart.indexOf(q.id) < 0 && q.price <= pr[0].price; });
    var free = pr && pr[1] ? cardHtml(pr[1], true) : '<div class="ghost"><div><b>+1</b><small>'+(pr ? (cand ? 'Add one more. Anything up to '+money(pr[0].price)+' is free' : 'Add one more. The cheaper one is free') : 'Pick a second one. It\'s free')+'</small></div></div>';
    var slots = '<div class="slots"><div class="slot p"><span class="lab">You pay</span>'+paid+'</div><span class="op">+</span><div class="slot f"><span class="lab">Free</span>'+free+'</div></div>';
    var sum = '<div class="st-sum"><div><div class="lbl">'+(c.pairs.length > 1 ? 'You pay, all pairs' : 'You pay')+'</div><div class="big" id="big">'+money(c.pay)+'</div>' +
      (c.reg > c.pay ? '<div class="was">Regular price <s>'+money(c.reg)+'</s></div>' : '<div class="was">&nbsp;</div>') + '</div>' +
      (c.reg > c.pay ? '<span class="save">You save '+money(c.reg - c.pay)+'</span>' : '') + '</div>';
    var brk = c.off ? '<div class="brk"><div><span>After the usual discount</span><b>'+money(c.full)+'</b></div><div><span>1+1 free</span><b>−'+money(c.off)+'</b></div></div>' : '';
    if (!n) sum = '';
    return hd + slots + sum + brk + '<button class="co" data-co'+(n ? '' : ' disabled')+'>'+(n ? 'Check out' : 'Pick any two')+'</button>' +
      (n ? '<p class="after">After you pay, you get an email from Jay within 24 hours with the next steps.</p>' : '') +
      '<p class="rule">Picking more? We pair them from the priciest down. In every pair, the cheaper one is free.</p>';
  }

  /* FLIP: remember where every card was, render, then move each card from there */
  var lastFree = {};
  function render(addedId){
    var c = calc(cart);
    if (!c.pairs.length) view = -1;
    else if (addedId) view = c.pairOf[addedId];
    else if (view < 0 || view >= c.pairs.length) view = c.pairs.length - 1;
    var before = {};
    [].forEach.call(document.querySelectorAll("[data-sc]"), function(el){ before[el.getAttribute("data-sc")] = el.getBoundingClientRect(); });
    $("station").innerHTML = stationHtml(c);
    var pv = c.pairs[view];
    P.forEach(function(p){
      var el = $("c-"+p.id), inC = cart.indexOf(p.id) >= 0, f = !!c.free[p.id];
      el.classList.toggle("in", inC); el.classList.toggle("pay", inC && !f); el.classList.toggle("free", f);
      el.querySelector(".st").textContent = f ? "FREE" : inC ? "You pay" : "";
      el.querySelector(".add").textContent = inC ? "Remove" : "Add";
      el.classList.toggle("can", !inC && !!pv && !pv[1] && p.price <= pv[0].price);
    });
    var both = BEST.every(function(id){ return cart.indexOf(id) >= 0; });
    $("best-btn").textContent = both ? "✓ This pair is in" : "Put this pair in"; $("best-btn").classList.toggle("on", both);
    if (G && !reduce){
      [].forEach.call(document.querySelectorAll("[data-sc]"), function(el){
        var id = el.getAttribute("data-sc"), to = el.getBoundingClientRect(), from = before[id];
        if (!from && id === addedId){ var im = $("c-"+id).querySelector(".im").getBoundingClientRect(); if (im.bottom > 0 && im.top < innerHeight) from = im; }
        if (from && to.width){
          G.fromTo(el, { x: from.left - to.left, y: from.top - to.top, scaleX: from.width / to.width, scaleY: from.height / to.height, transformOrigin: "0 0" },
            { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: before[id] ? .55 : .65, ease: "power3.inOut", clearProps: "transform" });
        } else if (id === addedId){ G.fromTo(el, { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: "back.out(1.8)" }); }
        var st = el.querySelector(".stamp");
        if (st && !lastFree[id]) G.fromTo(st, { scale: 2.2, rotation: -30, opacity: 0 }, { scale: 1, rotation: -12, opacity: 1, duration: .18, ease: "power4.in", delay: .55 });
      });
      var big = $("big"); if (addedId && big) G.fromTo(big, { scale: 1.08 }, { scale: 1, duration: .4, ease: "power2.out", delay: .5 });
    }
    lastFree = c.free;
    try { localStorage.setItem("bf11_cart", JSON.stringify(cart)); history.replaceState(null, "", (cart.length ? "?pick=" + cart.join(",") : location.pathname) + location.hash); } catch(e){}
  }

  function freeName(c){ var f = c.items.filter(function(p){ return c.free[p.id]; }); return f.length ? f[f.length-1].m + " is free" : ""; }
  function add(id){
    if (cart.indexOf(id) >= 0) return;
    cart.push(id); render(id); track("bf11_add", { item: id, n: cart.length });
    var c = calc(cart); note(byId[id].m + " added" + (cart.length > 1 && !(cart.length % 2) ? ". " + freeName(c) : ""));
  }
  function remove(id){ var i = cart.indexOf(id); if (i >= 0){ cart.splice(i,1); render(); track("bf11_remove", { item: id }); } }
  function note(t){ if (docked() && !$("station").classList.contains("open")) toast(t); }
  function openSt(on){ $("station").classList.toggle("open", on); $("veil").classList.toggle("on", on); }

  document.addEventListener("click", function(e){
    var t = e.target;
    if (t.closest("a")){ var mo = t.closest("[data-more]"); if (mo) track("bf11_details", { item: mo.getAttribute("data-more") }); return; }
    var bu = t.closest("[data-bundle]"); if (bu){ var nw = bu.getAttribute("data-bundle").split(",").filter(function(id){ return cart.indexOf(id) < 0; });
      if (!nw.length) return; nw.forEach(function(id){ cart.push(id); }); render(nw[nw.length-1]); track("bf11_best_add"); note("Donna + Wonka in. Donna is free"); return; }
    var rm = t.closest("[data-rm]"); if (rm){ remove(rm.getAttribute("data-rm")); return; }
    if (t.closest("[data-clear]")){ cart = []; render(); return; }
    var vw = t.closest("[data-view]"); if (vw){ view = +vw.getAttribute("data-view"); render(); return; }
    var co = t.closest("[data-co]"); if (co){ if (cart.length && !co.disabled) checkout(co); return; }
    if (t.closest("#veil") || t.closest(".st-close")){ openSt(false); return; }
    if (docked() && t.closest("#station") && !$("station").classList.contains("open")){ openSt(true); return; }
    var cd = t.closest("[data-t]"); if (cd){ var id = cd.getAttribute("data-t"); if (cart.indexOf(id) >= 0) remove(id); else add(id); }
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") openSt(false); });

  /* Check out: the server (bf11-checkout) prices the cart from its own list and opens one Stripe
     Checkout for all of it. The page sends ids only. */
  var CO_URL = "https://faqjilunlzljbgrnpcgi.supabase.co/functions/v1/bf11-checkout";
  function checkout(btn){
    track("bf11_checkout", { n: cart.length });
    document.querySelectorAll("[data-co]").forEach(function(b){ b.disabled = true; b.textContent = "Opening checkout..."; });
    function restore(msg){ render(); toast(msg || "Checkout did not open. Try again."); }
    fetch(CO_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items: cart }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(x){ if (x.ok && x.d && x.d.url){ location.href = x.d.url; return; } restore(x.d && x.d.message); })
      .catch(function(){ restore(); });
  }
  /* Back from Stripe: the browser restores the page as it was left, button frozen on "Opening checkout..." */
  window.addEventListener("pageshow", function(e){ if (e.persisted) render(); });

  function init(){
    G = window.gsap || null;
    tick(); setInterval(tick, 1000);
    build();
    var q = location.search, mp = q.match(/[?&]pick=([^&]+)/), ad = q.match(/[?&]add=([^&]+)/), saved = [];
    try { saved = JSON.parse(localStorage.getItem("bf11_cart") || "[]"); } catch(e){}
    (mp ? decodeURIComponent(mp[1]).split(",") : saved).concat(ad ? decodeURIComponent(ad[1]).split(",") : []).forEach(function(id){ if (byId[id] && cart.indexOf(id) < 0) cart.push(id); });
    render();
    if (/[?&]canceled=1/.test(q)) toast("Checkout canceled. Your cart is still here.");
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
</body>
</html>
