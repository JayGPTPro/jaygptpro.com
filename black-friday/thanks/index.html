<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank you · 1+1 · Jay GPT Pro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--s1:#0e0e10;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--txt:#f5f5f7;--mute:#a1a1a6;--lime:#d4ff00;--ink:#0b0d00;--f:"Geist",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:min(680px,100% - 40px);margin-inline:auto;padding:64px 0 80px}
.brand{font-weight:800;font-size:15px;text-decoration:none}
.brand span{color:var(--mute);font-weight:600}
h1{font-size:clamp(32px,6vw,48px);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:40px 0 12px}
h1 em{font-style:normal;color:var(--lime)}
.lead{color:var(--mute);font-size:18px;max-width:52ch}
ul{list-style:none;margin:36px 0 0;display:grid;gap:12px}
li{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.name{font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.free{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink);background:var(--lime);border-radius:6px;padding:2px 7px}
.foot{margin-top:36px;color:var(--mute);font-size:15px}
.foot a{color:var(--txt)}
.kit{display:inline-flex;align-items:center;margin-top:12px;height:44px;padding:0 18px;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:800;font-size:15px;text-decoration:none}
.now{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--lime);border:1px solid var(--lime);border-radius:6px;padding:1px 6px}
.sub2{margin-top:6px;color:var(--mute);font-size:14.5px}
</style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M4RK6H5NMH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-M4RK6H5NMH');</script>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">Jay GPT Pro <span>· 1+1</span></a>
  <h1>You're in. <em>Thank you.</em></h1>
  <p class="lead" id="lead">Your payment went through. Within 24 hours you'll get an email from Jay with the next steps for each item below.</p>
  <ul id="list"></ul>
  <p class="foot">A confirmation is on its way to your inbox. Any question, write to <a href="mailto:info@jaygptpro.com">info@jaygptpro.com</a>.</p>
  <p class="foot"><a href="/black-friday/">Back to the store</a></p>
</div>
<script>
(function () {
  try { localStorage.removeItem("bf11_cart"); } catch (e) {}
  var q = new URLSearchParams(location.search);
  var NAMES = {
    gift: "The Perfect Gift Skill", donna: "Donna Challenge", wonka: "Wonka Bootcamp", vault: "The AI Vault, 1 year",
    call: "1:1 AI call", calls4: "4 AI calls", xmas: "Christmas film for your product", build: "Custom AI workflow",
    images: "Product image system", video: "Product video & ads system"
  };
  var ids = (q.get("items") || "").split(",").filter(function (id) { return Object.prototype.hasOwnProperty.call(NAMES, id); });
  // One purchase event per order (a reload of this page does not count it again).
  try {
    var key = "bf11_done_" + (q.get("s") || q.get("items") || "x");
    if (ids.length && !sessionStorage.getItem(key)) { sessionStorage.setItem(key, "1"); gtag("event", "bf11_purchase", { items: ids.join(","), n: ids.length }); }
  } catch (e) {}
  // The second item of every pair is the free one (the list arrives priciest first).
  var list = document.getElementById("list");
  if (!ids.length) {
    list.innerHTML = '<li><div class="name">Your order details are in your inbox.</div></li>';
    return;
  }
  // The Perfect Gift Skill opens right away: the kit page takes this order's session id (christmas-kit
  // checks that it is paid and holds the Skill). Everything else comes by email from Jay.
  var sid = q.get("s") || "", kit = ids.indexOf("gift") >= 0 && /^cs_(live|test)_[A-Za-z0-9]{20,200}$/.test(sid);
  var rest = ids.filter(function (id) { return id !== "gift"; }).length;
  if (kit) document.getElementById("lead").textContent = rest
    ? "Your payment went through. Your Perfect Gift Skill is ready now. For the rest, within 24 hours you'll get an email from Jay with the next steps."
    : "Your payment went through. Your Perfect Gift Skill is ready now.";
  list.innerHTML = ids.map(function (id, i) {
    var gift = id === "gift" && kit;
    return '<li><div class="name">' + NAMES[id] + (i % 2 ? ' <span class="free">FREE 1+1</span>' : '') + (gift ? ' <span class="now">READY NOW</span>' : '') + '</div>' +
      (gift ? '<p class="sub2">The download and the first steps are on your kit page. The link is also in your confirmation email.</p><a class="kit" href="/christmas-video/kit/?s=' + encodeURIComponent(sid) + '">Open my kit</a>' : '') + '</li>';
  }).join("");
})();
</script>
</body>
</html>
