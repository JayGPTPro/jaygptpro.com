<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you | The Perfect Gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0b1018;--night2:#111927;--ink:#f4efe6;--dim:#a9a595;--gold:#e8c684;--gold2:#c79a4a;--red:#b3262c;--line:rgba(232,198,132,.22);--serif:"Playfair Display",Didot,"Bodoni 72",Georgia,serif;--sans:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--ink);font:17px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(40px,6.4vw,84px);line-height:1.04}
h2{font-size:clamp(30px,4.2vw,54px);line-height:1.1}
h3{font-size:24px;line-height:1.25}
em{font-style:italic;color:var(--gold)}
p{margin:0}
.lead{font-size:clamp(17px,1.6vw,20px);color:#d9d3c5;max-width:36em}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 16px/1 var(--sans);padding:18px 30px;border-radius:999px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn.gold{background:linear-gradient(180deg,#f3d9a2,#d9ae63);color:#1a1206;box-shadow:0 10px 40px rgba(232,198,132,.25)}
.btn.gold:hover{transform:translateY(-2px);box-shadow:0 16px 50px rgba(232,198,132,.38)}
.btn.ghost{border-color:rgba(244,239,230,.35);color:var(--ink)}
.btn.ghost:hover{background:rgba(244,239,230,.08)}
section{padding:110px 0;position:relative}
.rule{width:64px;height:1px;background:var(--gold);margin:22px 0 26px}
.center{text-align:center}.center .rule{margin-left:auto;margin-right:auto}.center .lead{margin-left:auto;margin-right:auto}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:linear-gradient(180deg,rgba(11,16,24,.85),rgba(11,16,24,0))}
nav .brand{font:600 13px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;text-decoration:none}
nav .btn{padding:11px 20px;font-size:14px}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:0 0 9vh;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,16,24,.35) 0%,rgba(11,16,24,.1) 35%,rgba(11,16,24,.82) 78%,var(--night) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{max-width:13em;margin:18px 0 22px;text-shadow:0 2px 30px rgba(0,0,0,.5)}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.hero .fine{margin-top:18px;color:var(--dim);font-size:14px}

/* film */
.film{padding-top:40px}
.player{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px var(--line);background:#000;aspect-ratio:16/9}
.player video{width:100%;height:100%}
.player .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,16,24,.28) center/cover;border:0;cursor:pointer;color:var(--ink)}
.player .play span{width:96px;height:96px;border-radius:50%;background:rgba(244,239,230,.14);backdrop-filter:blur(8px);border:1px solid rgba(244,239,230,.5);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.player .play:hover span{transform:scale(1.07)}
.player .play svg{margin-left:6px}
.film .note{margin-top:16px;color:var(--dim);font-size:14px;text-align:center}

/* problem */
.problem{background:radial-gradient(900px 400px at 50% 0%,rgba(232,198,132,.07),transparent 70%)}
.problem h2{max-width:14em;margin:0 auto}

/* story */
.beats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:56px}
.beat{position:relative;border-radius:12px;overflow:hidden;background:var(--night2);border:1px solid var(--line)}
.beat img{aspect-ratio:4/5;object-fit:cover;width:100%;transition:transform .8s}
.beat:hover img{transform:scale(1.04)}
.beat .t{padding:18px 18px 22px}
.beat .n{font:500 13px/1 var(--sans);letter-spacing:.2em;color:var(--gold)}
.beat h3{margin:10px 0 8px;font-size:22px}
.beat p{color:var(--dim);font-size:15px;line-height:1.55}
.quote{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3vw,38px);line-height:1.3;text-align:center;max-width:20em;margin:80px auto 0;color:var(--ink)}
.quote b{display:block;font-weight:400;color:var(--gold)}

/* product */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.split img{border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px var(--line)}
.checks{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px}
.checks li{padding-left:34px;position:relative;color:#d9d3c5}
.checks li::before{content:"";position:absolute;left:0;top:.45em;width:18px;height:10px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}

/* yours */
.who{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:44px}
.who.who3{grid-template-columns:1.2fr 1fr 1.3fr}
.who .card{border:1px solid var(--line);border-radius:14px;padding:30px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0))}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chips span{padding:9px 16px;border-radius:999px;border:1px solid rgba(244,239,230,.25);font-size:14px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px;counter-reset:s}
.step{padding:30px;border-radius:14px;background:var(--night2);border:1px solid var(--line)}
.step::before{counter-increment:s;content:"0" counter(s);font:400 44px/1 var(--serif);color:var(--gold);display:block;margin-bottom:16px}
.step p{color:var(--dim);margin-top:8px;font-size:15px}

.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:44px}
.spec{border:1px solid var(--line);border-radius:14px;padding:26px 22px;background:var(--night2)}
.spec b{display:block;font:400 21px/1.25 var(--serif);margin-bottom:8px}
.spec span{color:var(--dim);font-size:15px;line-height:1.5}
.about{display:grid;grid-template-columns:150px 1fr;gap:34px;align-items:center;max-width:860px;margin:0 auto;border:1px solid var(--line);border-radius:18px;padding:36px;background:var(--night2)}
.about img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.about p{color:#d9d3c5;margin-top:10px}
.sticky{display:none}
@media (max-width:860px){
  .specs{grid-template-columns:1fr 1fr}
  .about{grid-template-columns:1fr;text-align:center;padding:28px 20px}.about img{margin:0 auto}
  .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(11,16,24,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);align-items:center;gap:12px;transform:translateY(110%);transition:transform .25s}
  .sticky.on{transform:none}
  .sticky span{font-size:13px;color:var(--dim);line-height:1.3;flex:1}.sticky span b{color:var(--ink);font-size:15px;display:block}
  .sticky .btn{padding:14px 20px;font-size:15px;white-space:nowrap}
  body{padding-bottom:76px}
}

/* pricing */
.plans{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-top:50px;align-items:stretch}
.plan{border-radius:18px;padding:38px;border:1px solid var(--line);background:var(--night2);display:flex;flex-direction:column}
.plan.main{background:linear-gradient(180deg,#1a2233,#121a28);border-color:rgba(232,198,132,.55);box-shadow:0 30px 100px rgba(0,0,0,.5)}
.plan .tag{font:600 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.plan h3{font-size:32px;margin:12px 0 4px}
.price{font:400 64px/1 var(--serif);margin:18px 0 4px}
.price small{font:500 15px/1 var(--sans);color:var(--dim);margin-left:8px}
.plan .sub{color:var(--dim);font-size:15px}
.price s{font-size:.45em;color:var(--dim);margin-right:14px;text-decoration-thickness:2px}
.sub s{opacity:.8}
.plan .btn{margin-top:auto;justify-content:center}
.plan .total{margin-top:20px;padding-top:18px}
.plan .total span{flex:1;min-width:200px}
.plan .checks{margin:22px 0 30px}
.pick{margin-top:26px;text-align:center;color:var(--dim);font-size:15px}

/* order */
.order{background:linear-gradient(180deg,var(--night),#0d1420)}
form{max-width:720px;margin:44px auto 0;border:1px solid var(--line);border-radius:18px;padding:36px;background:var(--night2)}
label.f{display:block;font-weight:600;margin:24px 0 10px}
label.f:first-child{margin-top:0}
input[type=url],input[type=email],input[type=number]{width:100%;padding:15px 16px;border-radius:10px;border:1px solid rgba(244,239,230,.22);background:#0b1018;color:var(--ink);font:16px var(--sans)}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0}
.opts span{display:block;padding:11px 20px;border-radius:999px;border:1px solid rgba(244,239,230,.25);font-size:15px;transition:all .15s}
.opts input:checked+span{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:600}
.opts input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.qty{display:flex;align-items:center;gap:16px}
.qty input{width:110px}
.total{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.total b{font:400 40px/1 var(--serif)}
.total span{color:var(--dim);font-size:14px}
form .btn{width:100%;justify-content:center;margin-top:24px}
.draft{margin-top:14px;font-size:13px;color:#e9b96a;text-align:center}

.buy{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin:44px auto 0;max-width:980px;align-items:stretch}
.buy .total{margin-top:22px}
@media (max-width:860px){.buy{grid-template-columns:1fr}}

/* faq */
details{border-bottom:1px solid var(--line);padding:22px 0}
details summary{cursor:pointer;list-style:none;font:400 22px/1.3 var(--serif);display:flex;justify-content:space-between;gap:20px}
details summary::after{content:"+";color:var(--gold);font-family:var(--sans)}
details[open] summary::after{content:"\2212"}
details p{color:var(--dim);margin-top:12px;max-width:44em}
.faq{max-width:820px;margin:40px auto 0}

/* final */
.final{padding:0;min-height:86svh;display:flex;align-items:center;overflow:hidden}
.final img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.final::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--night) 0%,rgba(11,16,24,.55) 30%,rgba(11,16,24,.7) 70%,var(--night) 100%)}
.final .wrap{position:relative;z-index:2;text-align:center}
.final h2{font-size:clamp(34px,5.4vw,72px);max-width:13em;margin:0 auto 26px}
footer{padding:36px 0 50px;text-align:center;color:var(--dim);font-size:13px}

@media (max-width:860px){
  section{padding:76px 0}
  .beats{grid-template-columns:1fr 1fr}
  .split,.plans,.who,.who.who3{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .wrap{padding:0 16px}
  nav{padding:12px 16px}
  .hero{padding-bottom:6vh}
  form,.plan{padding:26px 20px}
}
@media (max-width:520px){.beats{grid-template-columns:1fr}.beat img{aspect-ratio:16/10}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.beat img{transition:none}}
</style>

<body>
<nav><a class="brand" href="/christmas-video/">Jay GPT Pro</a></nav>
<main class="page"><div class="wrap"><div class="box center">
  <div class="eyebrow">Order received</div>
  <div class="rule"></div>
  <h1 style="font-size:clamp(36px,5.5vw,68px)">Thank you. <em>Santa's on it.</em></h1>
  <p class="lead" id="msg" style="margin:24px auto 0">Your Christmas video is on its way. A download link lands in your email within 48 hours (business days).</p>
  <p id="more" style="max-width:36em;margin-left:auto;margin-right:auto">If we need anything else about your product, we write to the email you paid with. Questions? <a href="mailto:info@jaygptpro.com">info@jaygptpro.com</a></p>
  <p style="margin-top:34px"><a class="btn ghost" href="/christmas-video/">Back to the page</a></p>
</div></div></main>
<script>
(function(){
  var q=new URLSearchParams(location.search),kind=q.get('p')||'video',sid=q.get('session_id')||'';
  var DEF={video:99,pack:345,skill:299},value=DEF[kind]||99,qty=1;
  try{var o=JSON.parse(localStorage.getItem('xmas_order')||'null');
    if(o&&(o.kind===kind||(o.kind!=='skill'&&kind!=='skill'))&&Date.now()-o.t<6*3600*1000){value=o.value;qty=o.qty;}}catch(e){}
  if(kind==='skill'){document.getElementById('msg').textContent='The Skill and the training arrive in your email within 48 hours.';document.getElementById('more').firstChild.textContent='We send them to the email you paid with. Questions? ';}
  else if(kind==='pack'){document.getElementById('msg').textContent='Your Christmas videos are on their way. We email you today for the rest of your product links, and each video arrives within 48 hours (business days).';}
  if(!sid||sid.indexOf('cs_')!==0)return;                      // only a real return from checkout counts
  try{if(localStorage.getItem('xmas_done_'+sid))return;localStorage.setItem('xmas_done_'+sid,'1');}catch(e){}
  var name=kind==='skill'?'christmas_skill':'christmas_video';
  try{if(window.fbq)fbq('track','Purchase',{value:value,currency:'USD',content_name:name,num_items:qty});}catch(e){}
  try{if(window.gtag)gtag('event','purchase',{transaction_id:sid,value:value,currency:'USD',items:[{item_id:name,item_name:name,quantity:qty,price:value/qty}]});}catch(e){}
})();
</script>
</body>
</html>
